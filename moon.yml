tasks:
  build:
    script: "bun install && bun x lerna run build"
    inputs:
      - "packages/**/*"
      - "package.json"
    outputs:
      - "packages/core/dist"
      - "packages/mastra/dist"
      - "packages/claude-agent-sdk/dist"
      - "packages/ai-sdk/dist"
      - "packages/langchain-js/dist"
  "install-local":
    script: "BUN_CONFIG_REGISTRY=http://localhost:4873 bun install"
  "publish-local":
    script: "BUN_CONFIG_REGISTRY=http://localhost:4873 bun install && bun x lerna run build && bash scripts/publish-local.sh"
