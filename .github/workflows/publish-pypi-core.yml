name: Publish PyPI package (core)

on:
  push:
    branches: [main]
    paths:
      - 'packages/core-py/**'
      - '.github/workflows/publish-pypi-core.yml'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publish-pypi-astropods-adapter-core
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version
        run: |
          VERSION=$(grep '^version' packages/core-py/pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Install build dependencies
        run: pip install build

      - name: Build
        run: python -m build
        working-directory: packages/core-py

      - name: Install test dependencies
        run: pip install pytest pytest-asyncio ".[dev]"
        working-directory: packages/core-py

      - name: Test
        run: pytest
        working-directory: packages/core-py

      - name: Check if version is already published
        id: check-published
        # A substring grep of `pip index versions` reads "0.4.0" as published
        # when only "0.4.01" is, and silently skips the release.
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://pypi.org/pypi/astropods-adapter-core/${VERSION}/json")
          case "$STATUS" in
            200)
              echo "published=true" >> $GITHUB_OUTPUT
              echo "::notice::astropods-adapter-core==${VERSION} is already published on PyPI"
              ;;
            404)
              echo "published=false" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "::error::PyPI returned unexpected status ${STATUS} when checking ${VERSION}"
              exit 1
              ;;
          esac

      - name: Publish
        if: steps.check-published.outputs.published == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/core-py/dist/
