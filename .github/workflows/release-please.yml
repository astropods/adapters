name: Release Please (Python)

# Versions packages/core-py and packages/langchain from conventional commits.
# The npm packages are versioned by lerna in publish.yml; lerna cannot see
# these two, because neither has a package.json.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-please-python
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Open or merge the release PR
    runs-on: ubuntu-latest

    steps:
      # A PR opened with GITHUB_TOKEN does not trigger workflows, so the
      # release PR would sit with no checks.
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
