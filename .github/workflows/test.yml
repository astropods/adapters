name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bunx lerna run build

      - name: Test
        run: bunx lerna run test

  test-claude-agent-sdk-matrix:
    name: claude-agent-sdk against SDK ${{ matrix.sdk-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor, a mid-range patch, and whatever is currently published as latest.
        # The adapter pins ^0.3.142 — when the SDK ships 0.4.x, extend this list
        # (and the dependency range in packages/claude-agent-sdk/package.json).
        sdk-version:
          - "0.3.142"
          - "0.3.150"
          - "latest"

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install workspace
        run: bun install

      - name: Override Claude Agent SDK to ${{ matrix.sdk-version }}
        working-directory: packages/claude-agent-sdk
        run: bun add @anthropic-ai/claude-agent-sdk@${{ matrix.sdk-version }}

      - name: Build adapter
        working-directory: packages/claude-agent-sdk
        run: bun run build

      - name: Test adapter
        working-directory: packages/claude-agent-sdk
        run: bun test

  test-python:
    name: Test Python packages
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - name: astropods-adapter-core
            path: packages/core-py
          - name: astropods-adapter-langchain
            path: packages/langchain

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package and dev dependencies
        working-directory: ${{ matrix.package.path }}
        run: pip install -e ".[dev]"

      - name: Run tests
        working-directory: ${{ matrix.package.path }}
        run: pytest
