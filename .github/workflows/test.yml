name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bunx lerna run build

      - name: Typecheck
        run: bunx lerna run typecheck

      - name: Test
        run: bunx lerna run test

  test-claude-agent-sdk-matrix:
    name: claude-agent-sdk against SDK ${{ matrix.sdk-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor, a mid-range patch, and whatever is currently published as latest.
        # The adapter pins ^0.3.142 — when the SDK ships 0.4.x, extend this list
        # (and the dependency range in packages/claude-agent-sdk/package.json).
        sdk-version:
          - "0.3.142"
          - "0.3.150"
          - "latest"

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Pin Claude Agent SDK to ${{ matrix.sdk-version }} and install
        run: |
          jq '.dependencies["@anthropic-ai/claude-agent-sdk"] = "${{ matrix.sdk-version }}"' \
            packages/claude-agent-sdk/package.json > /tmp/pkg.json
          mv /tmp/pkg.json packages/claude-agent-sdk/package.json
          bun install

      # tsc resolves `@astropods/adapter-core` via its declared `types`,
      # which only exist once core is built. Lerna walks deps in order.
      - name: Build adapter (with dependencies)
        run: bunx lerna run build --scope @astropods/adapter-claude-agent-sdk --include-dependencies

      - name: Test adapter
        working-directory: packages/claude-agent-sdk
        run: bun test

  test-python:
    name: Test Python packages
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - name: astropods-adapter-core
            path: packages/core-py
          - name: astropods-adapter-langchain
            path: packages/langchain

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # A sibling in this repo is normally ahead of its last PyPI release, so
      # resolving it from the index fails until a publish catches up.
      - name: Install sibling packages from the checkout
        run: pip install -e packages/core-py

      - name: Install package and dev dependencies
        working-directory: ${{ matrix.package.path }}
        run: pip install -e ".[dev]"

      - name: Run tests
        working-directory: ${{ matrix.package.path }}
        run: pytest
